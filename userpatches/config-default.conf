KERNEL_CONFIGURE="no"			# "no" skip menuconfig dialog; "yes" open it; empty = ask each time
CLEAN_LEVEL="oldcache"			# comma-separated list of clean targets: "make" = make clean for selected kernel and u-boot,
					# "debs" = delete packages in "./output/debs" for current branch and family,
					# "alldebs" = delete all packages in "./output/debs", "images" = delete "./output/images",
					# "cache" = delete "./output/cache", "sources" = delete "./sources"
					# "oldcache" = remove old cached rootfs except for the newest 8 files
					# NOTE: do not put "debs" here for pack/image reuse; otherwise u-boot/kernel debs are wiped before install

DEST_LANG="en_US.UTF-8"			# sl_SI.UTF-8, en_US.UTF-8

# advanced
EXTERNAL_NEW="prebuilt"			# compile and install or install prebuilt additional packages
INSTALL_HEADERS="yes"			# install kernel headers into the image (dkms / out-of-tree modules)
LIB_TAG="master"			# change to "branchname" to use any branch currently available.
USE_TORRENT="yes"			# use torrent network for faster toolchain and cache download
DOWNLOAD_MIRROR="china"			# set to "china" to use mirrors.tuna.tsinghua.edu.cn

BOARD="pathless-rk3566"
BRANCH=""
RELEASE=""
BUILD_OPT=""
BUILD_DESKTOP=""
GIT_SERVER="https://github.com/Tron-Z"
WIREGUARD="no"
BUILD_KSRC="yes"				# pack linux-source deb alongside the kernel
INSTALL_KSRC="no"				# do not install full kernel sources into the image (too large)
IGNORE_UPDATES=""
COMPRESS_OUTPUTIMAGE="no"
NO_APT_CACHER="yes"
GITEE_SERVER="no"

#install_balena_etcher="yes"
#install_zfs="yes"
#install_docker="yes"
#install_chromium="yes"
#install_firefox="yes"
