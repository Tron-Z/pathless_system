name: Remirror pathless-5.10 history

# Replace orphan snapshot with a pushable truncated upstream history.
# Shallow packs are rewritten via graft so GitHub accepts the push.
on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'How many recent upstream commits to keep (recommended 300-800)'
        required: true
        default: '400'
        type: string

permissions:
  contents: write

jobs:
  remirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main (branding assets)
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            external/branding
          sparse-checkout-cone-mode: false
          path: branding-src

      - name: Build pushable history from upstream and force-update branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

          OWNER=Tron-Z
          DST_URL="https://x-access-token:${TOKEN}@github.com/${OWNER}/pathless_system.git"
          UP_URL="https://github.com/orangepi-xunlong/linux-orangepi.git"
          UP_BRANCH=orange-pi-5.10-rk35xx
          DST_BRANCH=pathless-5.10-rk35xx

          echo "Cloning upstream ${UP_BRANCH} depth=${DEPTH}"
          rm -rf /tmp/up-wt
          git clone --depth "${DEPTH}" --single-branch --branch "${UP_BRANCH}" \
            "${UP_URL}" /tmp/up-wt
          cd /tmp/up-wt

          echo "Pre-graft commit count: $(git rev-list --count HEAD)"
          ROOT=$(git rev-list --reverse HEAD | head -n1)
          echo "Grafting root commit: ${ROOT}"
          git replace --graft "${ROOT}"
          # Rewrite history so graft becomes a real root (pushable, non-shallow)
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --tag-name-filter cat -- --all
          rm -rf .git/refs/original .git/refs/replace
          git reflog expire --expire=now --all
          git gc --prune=now --aggressive

          # Ensure we are not marked shallow
          rm -f .git/shallow || true

          echo "Post-rewrite commit count: $(git rev-list --count HEAD)"
          git log -3 --oneline

          git remote remove origin || true
          git remote add origin "${DST_URL}"

          attempt=1
          until git push --force --no-thin origin "HEAD:refs/heads/${DST_BRANCH}"; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            echo "Push attempt ${attempt} failed; retrying in 45s..."
            attempt=$((attempt + 1))
            sleep 45
          done

      - name: Restore Pathless DTS and scrub orangepi files
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          DST_URL="https://x-access-token:${TOKEN}@github.com/Tron-Z/pathless_system.git"
          BRANCH=pathless-5.10-rk35xx

          rm -rf /tmp/k510
          git clone --depth 1 --branch "${BRANCH}" "${DST_URL}" /tmp/k510
          cd /tmp/k510

          DTS_SRC="${GITHUB_WORKSPACE}/branding-src/external/branding/kernel/5.10/rk3566-pathless-3b.dts"
          DTS_DST="arch/arm64/boot/dts/rockchip/rk3566-pathless-3b.dts"
          MK="arch/arm64/boot/dts/rockchip/Makefile"
          test -f "${DTS_SRC}"
          mkdir -p "$(dirname "${DTS_DST}")"
          cp -f "${DTS_SRC}" "${DTS_DST}"

          if [ -f "${MK}" ] && ! grep -q 'rk3566-pathless-3b.dtb' "${MK}"; then
            if grep -q 'rk3566-orangepi-3b.dtb' "${MK}"; then
              sed -i 's/rk3566-orangepi-3b\.dtb/rk3566-pathless-3b.dtb/g' "${MK}"
            else
              sed -i '/rk3566-.*\.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-pathless-3b.dtb' "${MK}"
              awk '!seen[$0]++' "${MK}" > "${MK}.tmp" && mv "${MK}.tmp" "${MK}"
            fi
          fi

          mapfile -t FILES < <(git ls-files | grep -iE 'orangepi|orange-pi|xunlong' || true)
          if [ ${#FILES[@]} -gt 0 ]; then
            echo "Removing ${#FILES[@]} orangepi/xunlong paths"
            git rm -f --ignore-unmatch -- "${FILES[@]}" || true
          fi
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            sed -i -E '/orangepi|orange-pi|xunlong|OrangePi|ORANGEPI/Id' "$f" || true
          done < <(git ls-files | grep -E '(Makefile|Kconfig)$' || true)

          if [ -f "${MK}" ] && ! grep -q 'rk3566-pathless-3b.dtb' "${MK}"; then
            echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-pathless-3b.dtb' >> "${MK}"
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "pathless: restore RK3566 Pathless DTS and scrub orangepi leftovers"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
          git log -5 --oneline
          test -f "${DTS_DST}"
          echo "Commit count on tip clone: $(git rev-list --count HEAD) (depth-1 limited)"

      - name: Verify remote history depth
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DST_URL="https://x-access-token:${TOKEN}@github.com/Tron-Z/pathless_system.git"
          rm -rf /tmp/count
          git clone --depth 500 --filter=blob:none --single-branch --branch pathless-5.10-rk35xx \
            "${DST_URL}" /tmp/count
          cd /tmp/count
          COUNT=$(git rev-list --count HEAD)
          echo "Visible commit count (depth<=500 clone): ${COUNT}"
          git log -5 --oneline
          test -f arch/arm64/boot/dts/rockchip/rk3566-pathless-3b.dts
          if [ "${COUNT}" -lt 50 ]; then
            echo "History still too short"
            exit 1
          fi
