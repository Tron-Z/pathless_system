name: Remirror pathless-5.10 history

# Rebuild pathless-5.10-rk35xx with pushable upstream history (not orphan).
# depth=0 tries full history first; on failure grafts a truncated window.
on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Commits to keep (0 = try full history, else e.g. 2000)'
        required: true
        default: '2000'
        type: string

permissions:
  contents: write

jobs:
  remirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main (branding assets)
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            external/branding
          sparse-checkout-cone-mode: false
          path: branding-src

      - name: Build pushable history from upstream and force-update branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global http.postBuffer 2147483648
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

          OWNER=Tron-Z
          DST_URL="https://x-access-token:${TOKEN}@github.com/${OWNER}/pathless_system.git"
          UP_URL="https://github.com/orangepi-xunlong/linux-orangepi.git"
          UP_BRANCH=orange-pi-5.10-rk35xx
          DST_BRANCH=pathless-5.10-rk35xx

          push_branch() {
            local dir=$1
            git -C "${dir}" remote remove origin 2>/dev/null || true
            git -C "${dir}" remote add origin "${DST_URL}"
            local attempt=1
            until git -C "${dir}" push --force --no-thin origin "HEAD:refs/heads/${DST_BRANCH}"; do
              if [ "$attempt" -ge 5 ]; then
                return 1
              fi
              echo "Push attempt ${attempt} failed; retrying in 45s..."
              attempt=$((attempt + 1))
              sleep 45
            done
          }

          graft_and_push() {
            local depth=$1
            echo "=== Graft mode depth=${depth} ==="
            rm -rf /tmp/up-wt
            git clone --depth "${depth}" --single-branch --branch "${UP_BRANCH}" \
              "${UP_URL}" /tmp/up-wt
            cd /tmp/up-wt
            echo "Pre-graft commit count: $(git rev-list --count HEAD)"
            ROOT=$(git rev-list --reverse HEAD | sed -n '1p')
            echo "Grafting root commit: ${ROOT}"
            test -n "${ROOT}"
            git replace --graft "${ROOT}"
            sudo apt-get update -qq
            sudo apt-get install -y -qq git-filter-repo
            git filter-repo --force
            rm -f .git/shallow || true
            echo "Post-rewrite commit count: $(git rev-list --count HEAD)"
            git log -3 --oneline
            push_branch /tmp/up-wt
          }

          if [ "${DEPTH}" = "0" ]; then
            echo "=== Trying full-history bare mirror ==="
            rm -rf /tmp/up-bare
            if git clone --bare --single-branch --branch "${UP_BRANCH}" "${UP_URL}" /tmp/up-bare; then
              echo "Full clone commit count: $(git -C /tmp/up-bare rev-list --count "${UP_BRANCH}")"
              if git -C /tmp/up-bare push --force --no-thin "${DST_URL}" \
                  "${UP_BRANCH}:refs/heads/${DST_BRANCH}"; then
                echo "Full-history push succeeded"
                exit 0
              fi
              echo "Full-history push failed; falling back to graft depth=2000"
            else
              echo "Full clone failed; falling back to graft depth=2000"
            fi
            graft_and_push 2000
          else
            graft_and_push "${DEPTH}"
          fi

      - name: Restore Pathless DTS and scrub orangepi board files
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          DST_URL="https://x-access-token:${TOKEN}@github.com/Tron-Z/pathless_system.git"
          BRANCH=pathless-5.10-rk35xx

          rm -rf /tmp/k510
          git clone --depth 1 --branch "${BRANCH}" "${DST_URL}" /tmp/k510
          cd /tmp/k510

          DTS_SRC="${GITHUB_WORKSPACE}/branding-src/external/branding/kernel/5.10/rk3566-pathless-3b.dts"
          DTS_DST="arch/arm64/boot/dts/rockchip/rk3566-pathless-3b.dts"
          MK="arch/arm64/boot/dts/rockchip/Makefile"
          test -f "${DTS_SRC}"
          mkdir -p "$(dirname "${DTS_DST}")"
          cp -f "${DTS_SRC}" "${DTS_DST}"

          if [ -f "${MK}" ] && ! grep -q 'rk3566-pathless-3b.dtb' "${MK}"; then
            if grep -q 'rk3566-orangepi-3b.dtb' "${MK}"; then
              sed -i 's/rk3566-orangepi-3b\.dtb/rk3566-pathless-3b.dtb/g' "${MK}"
            else
              sed -i '/rk3566-.*\.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-pathless-3b.dtb' "${MK}"
              awk '!seen[$0]++' "${MK}" > "${MK}.tmp" && mv "${MK}.tmp" "${MK}"
            fi
          fi

          # Only scrub orangepi/xunlong *paths*; keep Pathless files.
          mapfile -t FILES < <(git ls-files | grep -iE 'orangepi|orange-pi|xunlong' || true)
          if [ ${#FILES[@]} -gt 0 ]; then
            echo "Removing ${#FILES[@]} orangepi/xunlong paths"
            git rm -f --ignore-unmatch -- "${FILES[@]}" || true
          fi
          # Narrow Makefile scrub: drop orangepi dtb lines only, not every match.
          if [ -f "${MK}" ]; then
            sed -i -E '/orangepi|orange-pi|xunlong|OrangePi|ORANGEPI/d' "${MK}" || true
          fi
          if [ -f "${MK}" ] && ! grep -q 'rk3566-pathless-3b.dtb' "${MK}"; then
            echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-pathless-3b.dtb' >> "${MK}"
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "pathless: restore RK3566 Pathless DTS and scrub orangepi leftovers"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
          test -f "${DTS_DST}"
          grep -q 'rk3566-pathless-3b.dtb' "${MK}"
          git log -5 --oneline

      - name: Verify remote history depth
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          DST_URL="https://x-access-token:${TOKEN}@github.com/Tron-Z/pathless_system.git"
          rm -rf /tmp/count
          # Clone deep enough to see grafted history (cap 3000 for time/disk).
          CLONE_DEPTH=3000
          if [ "${DEPTH}" != "0" ] && [ "${DEPTH}" -gt 0 ] && [ "${DEPTH}" -lt 3000 ]; then
            CLONE_DEPTH=$((DEPTH + 50))
          fi
          git clone --depth "${CLONE_DEPTH}" --filter=blob:none --single-branch \
            --branch pathless-5.10-rk35xx "${DST_URL}" /tmp/count
          cd /tmp/count
          COUNT=$(git rev-list --count HEAD)
          echo "Visible commit count (clone depth ${CLONE_DEPTH}): ${COUNT}"
          git log -5 --oneline
          test -f arch/arm64/boot/dts/rockchip/rk3566-pathless-3b.dts
          ! test -f arch/arm64/boot/dts/rockchip/rk3566-orangepi-3b.dts
          MIN=100
          if [ "${DEPTH}" != "0" ] && [ "${DEPTH}" -gt 100 ]; then
            MIN=$((DEPTH * 8 / 10))
          fi
          if [ "${COUNT}" -lt "${MIN}" ]; then
            echo "History too short: have ${COUNT}, want >= ${MIN}"
            exit 1
          fi
          echo "OK: pathless-5.10-rk35xx history depth verified (${COUNT} commits)"
