name: Sync upstream sources

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: orange-pi-6.6-rk35xx
            pathless: pathless-6.6-rk35xx
          - upstream: orange-pi-5.10-rk35xx
            pathless: pathless-5.10-rk35xx
    steps:
      - name: Mirror linux-orangepi/${{ matrix.upstream }} → kernel/${{ matrix.pathless }}
        run: |
          git clone --bare --branch "${{ matrix.upstream }}" \
            https://github.com/orangepi-xunlong/linux-orangepi.git /tmp/upstream-kernel
          cd /tmp/upstream-kernel
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Tron-Z/kernel.git" \
            "refs/heads/${{ matrix.upstream }}:refs/heads/${{ matrix.pathless }}"

  sync-rockchip-rkbin:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror rockchip-linux/rkbin → pathless-rockchip/rkbin
        run: |
          git clone --bare https://github.com/rockchip-linux/rkbin.git /tmp/upstream-rkbin
          cd /tmp/upstream-rkbin
          DEFAULT=$(git symbolic-ref HEAD 2>/dev/null | sed 's#refs/heads/##' || echo master)
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Tron-Z/pathless-rockchip.git" \
            "refs/heads/${DEFAULT}:refs/heads/rkbin"

  sync-rockchip-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror rk-rootfs-build/rk35xx_packages → pathless-rockchip/rk35xx_packages
        run: |
          git clone --bare --branch rk35xx_packages \
            https://github.com/orangepi-xunlong/rk-rootfs-build.git /tmp/upstream-pkg
          cd /tmp/upstream-pkg
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Tron-Z/pathless-rockchip.git" \
            refs/heads/rk35xx_packages:refs/heads/rk35xx_packages
