name: Migrate into pathless_system

# One-shot (or re-runnable) mirror of legacy split repos into pathless_system branches.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - src: pathless-bsp-kernel
            src_branch: pathless-6.6-rk35xx
            dst_branch: pathless-6.6-rk35xx
          - src: pathless-bsp-kernel
            src_branch: pathless-5.10-rk35xx
            dst_branch: pathless-5.10-rk35xx
          - src: pathless-bsp-u-boot
            src_branch: v2017.09-rk3588
            dst_branch: u-boot
          - src: pathless-bsp-firmware
            src_branch: master
            dst_branch: firmware
          - src: pathless-bsp-config
            src_branch: master
            dst_branch: config
          - src: pathless-rockchip
            src_branch: rkbin
            dst_branch: rkbin
          - src: pathless-rockchip
            src_branch: rk35xx_packages
            dst_branch: rk35xx_packages
          - src: oh-my-zsh
            src_branch: master
            dst_branch: oh-my-zsh
          - src: evalcache
            src_branch: master
            dst_branch: evalcache
          - src: wiringOP
            src_branch: next
            dst_branch: wiringOP
          - src: wiringOP-Python
            src_branch: next
            dst_branch: wiringOP-Python
    steps:
      - name: Mirror ${{ matrix.src }}:${{ matrix.src_branch }} → ${{ matrix.dst_branch }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ matrix.src }}
          SRC_BRANCH: ${{ matrix.src_branch }}
          DST_BRANCH: ${{ matrix.dst_branch }}
        run: |
          set -euo pipefail
          OWNER=Tron-Z
          DST=pathless_system
          DST_URL="https://x-access-token:${TOKEN}@github.com/${OWNER}/${DST}.git"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

          echo "==> ${SRC}:${SRC_BRANCH} -> ${DST}:${DST_BRANCH}"
          rm -rf /tmp/mrepo
          # Prefer full history; fall back to depth 200 (matches build fetch depth).
          if ! git clone --bare --branch "${SRC_BRANCH}" --single-branch \
              "https://github.com/${OWNER}/${SRC}.git" /tmp/mrepo; then
            echo "Full clone failed; retrying shallow depth=200"
            rm -rf /tmp/mrepo
            git clone --bare --depth 200 --branch "${SRC_BRANCH}" --single-branch \
              "https://github.com/${OWNER}/${SRC}.git" /tmp/mrepo
          fi

          attempt=1
          until git -C /tmp/mrepo push --force "${DST_URL}" "${SRC_BRANCH}:${DST_BRANCH}"; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            echo "Push attempt ${attempt} failed; retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done
