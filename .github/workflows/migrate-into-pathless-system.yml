name: Migrate into pathless_system

# Mirror legacy split repos into pathless_system. Destination branch = old repo name
# (kernel/rockchip keep their existing multi-branch names).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - src: pathless-bsp-kernel
            src_branch: pathless-6.6-rk35xx
            dst_branch: pathless-6.6-rk35xx
          - src: pathless-bsp-kernel
            src_branch: pathless-5.10-rk35xx
            dst_branch: pathless-5.10-rk35xx
          - src: pathless-bsp-u-boot
            src_branch: v2017.09-rk3588
            dst_branch: pathless-bsp-u-boot
          - src: pathless-bsp-firmware
            src_branch: master
            dst_branch: pathless-bsp-firmware
          - src: pathless-bsp-config
            src_branch: master
            dst_branch: pathless-bsp-config
          - src: pathless-rockchip
            src_branch: rkbin
            dst_branch: rkbin
          - src: pathless-rockchip
            src_branch: rk35xx_packages
            dst_branch: rk35xx_packages
          - src: oh-my-zsh
            src_branch: master
            dst_branch: oh-my-zsh
          - src: evalcache
            src_branch: master
            dst_branch: evalcache
          - src: wiringOP
            src_branch: next
            dst_branch: wiringOP
          - src: wiringOP-Python
            src_branch: next
            dst_branch: wiringOP-Python
    steps:
      - name: Mirror ${{ matrix.src }}:${{ matrix.src_branch }} → ${{ matrix.dst_branch }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ matrix.src }}
          SRC_BRANCH: ${{ matrix.src_branch }}
          DST_BRANCH: ${{ matrix.dst_branch }}
        run: |
          set -euo pipefail
          OWNER=Tron-Z
          DST=pathless_system
          DST_URL="https://x-access-token:${TOKEN}@github.com/${OWNER}/${DST}.git"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

          echo "==> ${SRC}:${SRC_BRANCH} -> ${DST}:${DST_BRANCH}"
          # depth=1 keeps packs self-contained (shallow depth>1 often fails remote unpack).
          DEPTH=1
          rm -rf /tmp/mtree
          git clone --depth "${DEPTH}" --branch "${SRC_BRANCH}" --single-branch \
            "https://github.com/${OWNER}/${SRC}.git" /tmp/mtree
          cd /tmp/mtree

          # Avoid GITHUB_TOKEN workflow-file rejection when mirroring third-party trees.
          if [ -d .github/workflows ]; then
            rm -rf .github/workflows
            git add -A
            git commit -m "pathless mirror: drop nested workflows" || true
          fi

          git remote remove origin || true
          git remote add origin "${DST_URL}"

          attempt=1
          until git push --force origin "HEAD:refs/heads/${DST_BRANCH}"; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            echo "Push attempt ${attempt} failed; retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done

  cleanup-wrong-short-names:
    needs: migrate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete short branch names if correct ones exist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DST_URL="https://x-access-token:${TOKEN}@github.com/Tron-Z/pathless_system.git"
          git clone --bare "$DST_URL" /tmp/ps
          cd /tmp/ps
          for pair in "u-boot:pathless-bsp-u-boot" "firmware:pathless-bsp-firmware" "config:pathless-bsp-config"; do
            wrong="${pair%%:*}"
            right="${pair##*:}"
            if git show-ref --verify --quiet "refs/heads/${right}" \
               && git show-ref --verify --quiet "refs/heads/${wrong}"; then
              echo "Deleting obsolete branch ${wrong} (kept ${right})"
              git push origin --delete "${wrong}" || true
            else
              echo "Skip delete ${wrong}"
              git show-ref | grep -E "refs/heads/(${wrong}|${right})$" || true
            fi
          done
