name: Mirror kernel 5.10 snapshot

# One-shot: orphan snapshot avoids incomplete shallow packs from pathless-bsp-kernel.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-5-10:
    runs-on: ubuntu-latest
    steps:
      - name: Orphan-snapshot pathless-5.10-rk35xx into pathless_system
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

          SRC=https://github.com/Tron-Z/pathless-bsp-kernel.git
          DST="https://x-access-token:${TOKEN}@github.com/Tron-Z/pathless_system.git"
          BRANCH=pathless-5.10-rk35xx

          rm -rf /tmp/k510 /tmp/snap
          echo "Cloning source ${BRANCH} (depth 1)..."
          git clone --depth 1 --branch "${BRANCH}" --single-branch "${SRC}" /tmp/k510

          echo "Creating orphan snapshot..."
          mkdir -p /tmp/snap
          # Prefer rsync; fall back to tar to avoid .git copy issues.
          if command -v rsync >/dev/null; then
            rsync -a --exclude='.git' /tmp/k510/ /tmp/snap/
          else
            tar -C /tmp/k510 --exclude='.git' -cf - . | tar -C /tmp/snap -xf -
          fi
          cd /tmp/snap
          git init -b "${BRANCH}"
          # Drop nested workflows if any
          rm -rf .github/workflows || true
          git add -A
          # Large files: keep as-is; GitHub soft limit is 100MB/file
          git -c core.compression=9 commit -m "pathless snapshot: ${BRANCH}"

          du -sh .git || true
          git count-objects -vH || true

          git remote add origin "${DST}"
          attempt=1
          until git push --force origin "HEAD:refs/heads/${BRANCH}"; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            echo "Push attempt ${attempt} failed; retrying in 45s..."
            attempt=$((attempt + 1))
            sleep 45
          done
          echo "OK: pathless_system:${BRANCH}"
