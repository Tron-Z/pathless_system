# Pathless GitHub source layout (Tron-Z) — unified repos
#
# pathless-build     — build system
# pathless-bsp-kernel — Linux kernel (large; kept separate)
# pathless-bsp        — multi-branch BSP:
#     u-boot | firmware | config | rkbin | rk35xx_packages
# pathless-3rdparty   — multi-branch third-party:
#     oh-my-zsh | evalcache | wiringOP | wiringOP-Python

[[ -z $GIT_SERVER ]] && GIT_SERVER="https://github.com/Tron-Z"

KERNEL_REPO="${GIT_SERVER}/pathless-bsp-kernel.git"
PATHLESS_BSP_REPO="${GIT_SERVER}/pathless-bsp.git"
PATHLESS_3RDPARTY_REPO="${GIT_SERVER}/pathless-3rdparty.git"

# BSP components (all in pathless-bsp)
PATHLESS_ROCKCHIP_REPO="${PATHLESS_BSP_REPO}"
PATHLESS_BSP_UBOOT_REPO="${PATHLESS_BSP_REPO}"
PATHLESS_BSP_FIRMWARE_REPO="${PATHLESS_BSP_REPO}"
PATHLESS_BSP_CONFIG_REPO="${PATHLESS_BSP_REPO}"

PATHLESS_RKBIN_BRANCH="branch:rkbin"
PATHLESS_RK35XX_PACKAGES_BRANCH="branch:rk35xx_packages"
PATHLESS_KERNEL_BRANCH_CURRENT="branch:pathless-6.6-rk35xx"
PATHLESS_KERNEL_BRANCH_LEGACY="branch:pathless-5.10-rk35xx"
PATHLESS_UBOOT_BRANCH="branch:u-boot"
PATHLESS_FIRMWARE_BRANCH="branch:firmware"
PATHLESS_CONFIG_BRANCH="branch:config"

# Third-party (pathless-3rdparty)
PATHLESS_OHMYZSH_BRANCH="branch:oh-my-zsh"
PATHLESS_EVALCACHE_BRANCH="branch:evalcache"
PATHLESS_WIRINGOP_BRANCH="branch:wiringOP"
PATHLESS_WIRINGOP_PYTHON_BRANCH="branch:wiringOP-Python"

[[ -z $KERNELSOURCE ]] && KERNELSOURCE="${KERNEL_REPO}"
[[ -z $BOOTSOURCE ]] && BOOTSOURCE="${PATHLESS_BSP_UBOOT_REPO}"
