# Pathless single-repo layout (Tron-Z/pathless_system)
#
# main                — build scripts
# pathless-6.6-rk35xx — kernel (current)
# pathless-5.10-rk35xx — kernel (legacy)
# u-boot              — U-Boot
# firmware            — board firmware
# config              — pathless-config
# rkbin / rk35xx_packages — Rockchip blobs
# oh-my-zsh / evalcache / wiringOP / wiringOP-Python — third-party

[[ -z $GIT_SERVER ]] && GIT_SERVER="https://github.com/Tron-Z"

PATHLESS_SYSTEM_REPO="${GIT_SERVER}/pathless_system.git"

KERNEL_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_ROCKCHIP_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_BSP_UBOOT_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_BSP_FIRMWARE_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_BSP_CONFIG_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_OHMYZSH_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_EVALCACHE_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_WIRINGOP_REPO="${PATHLESS_SYSTEM_REPO}"
PATHLESS_WIRINGOP_PYTHON_REPO="${PATHLESS_SYSTEM_REPO}"

PATHLESS_RKBIN_BRANCH="branch:rkbin"
PATHLESS_RK35XX_PACKAGES_BRANCH="branch:rk35xx_packages"
PATHLESS_KERNEL_BRANCH_CURRENT="branch:pathless-6.6-rk35xx"
PATHLESS_KERNEL_BRANCH_LEGACY="branch:pathless-5.10-rk35xx"
PATHLESS_UBOOT_BRANCH="branch:u-boot"
PATHLESS_FIRMWARE_BRANCH="branch:firmware"
PATHLESS_CONFIG_BRANCH="branch:config"
PATHLESS_OHMYZSH_BRANCH="branch:oh-my-zsh"
PATHLESS_EVALCACHE_BRANCH="branch:evalcache"
PATHLESS_WIRINGOP_BRANCH="branch:wiringOP"
PATHLESS_WIRINGOP_PYTHON_BRANCH="branch:wiringOP-Python"

[[ -z $KERNELSOURCE ]] && KERNELSOURCE="${KERNEL_REPO}"
[[ -z $BOOTSOURCE ]] && BOOTSOURCE="${PATHLESS_BSP_UBOOT_REPO}"
