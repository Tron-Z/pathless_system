# Pathless GitHub source layout (Tron-Z)
#
# kernel                — Pathless Linux kernel
# pathless-rockchip     — Rockchip vendor blobs (rkbin, rk35xx_packages)
# pathless-bsp-u-boot   — Pathless U-Boot
# pathless-bsp-firmware — Pathless board firmware overlays
# pathless-bsp-config   — Pathless system configuration utility

[[ -z $GIT_SERVER ]] && GIT_SERVER="https://github.com/Tron-Z"

KERNEL_REPO="${GIT_SERVER}/kernel.git"
PATHLESS_ROCKCHIP_REPO="${GIT_SERVER}/pathless-rockchip.git"
PATHLESS_BSP_UBOOT_REPO="${GIT_SERVER}/pathless-bsp-u-boot.git"
PATHLESS_BSP_FIRMWARE_REPO="${GIT_SERVER}/pathless-bsp-firmware.git"
PATHLESS_BSP_CONFIG_REPO="${GIT_SERVER}/pathless-bsp-config.git"

PATHLESS_RKBIN_BRANCH="branch:rkbin"
PATHLESS_RK35XX_PACKAGES_BRANCH="branch:rk35xx_packages"

PATHLESS_KERNEL_BRANCH_CURRENT="branch:pathless-6.6-rk35xx"
PATHLESS_KERNEL_BRANCH_LEGACY="branch:pathless-5.10-rk35xx"
PATHLESS_UBOOT_BRANCH="branch:v2017.09-rk3588"
PATHLESS_FIRMWARE_BRANCH="branch:master"
PATHLESS_CONFIG_BRANCH="branch:master"

[[ -z $KERNELSOURCE ]] && KERNELSOURCE="${KERNEL_REPO}"
[[ -z $BOOTSOURCE ]] && BOOTSOURCE="${PATHLESS_BSP_UBOOT_REPO}"
